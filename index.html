        /* Original App Styles */
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;

        }
        .chat-container::-webkit-scrollbar {
            width: 8px;
        }
        .chat-container::-webkit-scrollbar-track {
            background: #18181b;
        }
        .chat-container::-webkit-scrollbar-thumb {
            background: #00C9A7;
            border-radius: 4px;
        }
        .chat-container::-webkit-scrollbar-thumb:hover {
            background: #39FF14;
        }
        
        /* Custom, more visible resize handles for react-grid-layout */
        .react-grid-item .react-resizable-handle {
            position: absolute;
            width: 20px;
            height: 20px;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
            background: none !important;
            padding: 0 !important;
        }

        .react-grid-item:hover .react-resizable-handle {
            opacity: 1;
        }

        /* Style for the square corner handle */
        .react-grid-item .react-resizable-handle::after {
            content: ' ';
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: #39FF14;
            filter: drop-shadow(0 0 2px rgba(57, 255, 20, 0.6));
            border-radius: 1px;
        }

        /* Position each square handle inside its clickable area */
        .react-resizable-handle-se::after {
            right: 4px;
            bottom: 4px;
        }
        .react-resizable-handle-sw::after {
            left: 4px;
            bottom: 4px;
        }
        .react-resizable-handle-ne::after {
            right: 4px;
            top: 4px;
        }
        .react-resizable-handle-nw::after {
            left: 4px;
            top: 4px;
        }

        .react-grid-item.react-grid-placeholder {
            background: #39FF14 !important;
            opacity: 0.2;
            border-radius: 0.5rem;
            transition-duration: 100ms;
        }
